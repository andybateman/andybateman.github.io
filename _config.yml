# Site settings
title: Andy Bateman
email: andy@andybateman.com
description: Andy Bateman is just some guy, a very modest guy, you know?
baseurl: ""
url: "https://www.andybateman.com"
twitter_username: andybateman
facebook_username: andybateman
locale: en_NZ
permalink: /:categories/:title/

sass:
  sass_dir: _scss
  style: compressed

# HTML minification via the compress layout (penibelst). Strips inter-element
# whitespace; keeps comments (the ASCII-art easter egg survives). Skipped in
# development so local serves stay readable; GitHub Pages builds as production.
compress_html:
  clippings: all
  endings: all
  blanklines: false
  ignore:
    envs: [development]

defaults:
  - scope:
      path: ""
    values:
      image: /cdn/icons/andybateman/AppIcon76x76@2x_icons/macos/icon_1024x1024.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from