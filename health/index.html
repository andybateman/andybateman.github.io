---
title: Health
description: Recovery tracker — how Andy's injuries from 'The Accident' are healing.
map: true
---
<!doctype html>
<html lang="en" class="h-100">
<head>
  {% include head.html %}
  <style>
    body { background: #fbca12; }
    #wrap {
      position: absolute; top: 52px; left: 16px; right: 16px; bottom: 16px;
      background: #fff; border-radius: 6px; padding: 16px 18px 10px;
      box-shadow: 0 1px 5px rgba(0,0,0,.3);
    }
    #chart { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
</head>
<body>

<a id="home-link" href="/">←</a>
<div id="title">Health</div>

<div id="wrap"><canvas id="chart"></canvas></div>

<script>
  Chart.defaults.font.family = "'IBM Plex Mono', ui-monospace, monospace";
  Chart.defaults.color = '#1a1813';

  // [label, fixed %, still-broken %] — each row totals 100.
  var injuries = [
    ["Right foot surgery",                                        0, 100],
    ["Chest injury, left side (Closed fracture of 5-9 ribs)",    75,  25],
    ["Chest injury (Manipulation of rib 8)",                     40,  60],
    ["Chest injury (Closed fracture sternum)",                   66,  34],
    ["Leg injury, right side (Closed fracture of the lower)",    75,  25],
    ["Knee injury, right side (Closed fracture of the patella)", 75,  25],
    ["Arm injury, left side (Closed fracture of the scaphoid)",  25,  75],
    ["Arm injury, left side (Nerve damage)",                     10,  90],
    ["Toe injury, right side (Fracture of great toe)",           66,  34],
    ["Arm injury, right side (Closed fracture triquetral)",      70,  30],
    ["Abdomen or pelvis injury (Contusion, anterior abdominal wall)", 80, 20]
  ];

  // Wrap each label onto two lines at the bracket so long names stay readable.
  var labels = injuries.map(function(d) {
    return d[0].split(/ (?=\()/);
  });

  new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'Fixed',        data: injuries.map(function(d){return d[1];}), backgroundColor: '#27ae60' },
        { label: 'Still broken', data: injuries.map(function(d){return d[2];}), backgroundColor: '#c0392b' }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { stacked: true, min: 0, max: 100, ticks: { callback: function(v){return v + '%';} } },
        y: { stacked: true, ticks: { font: { size: 11 } } }
      },
      plugins: {
        title: {
          display: true,
          text: "How I'm healing after 'The Accident'",
          font: { family: "'Hanken Grotesk', system-ui, sans-serif", size: 18, weight: '700' },
          padding: { bottom: 14 }
        },
        legend: { position: 'bottom' },
        tooltip: {
          callbacks: {
            label: function(ctx) { return ctx.dataset.label + ': ' + ctx.parsed.x + '%'; }
          }
        }
      }
    }
  });
</script>

</body>
</html>
