<!-- Hey! What are you looking at?! -->
<html lang="en" class="h-100">
  <head>
    {% include head.html %}
  </head>
  <body class="text-dark">

    <main class="container my-4 my-md-5">
      <div class="mx-auto bg-white rounded-3 shadow-sm p-4 p-md-5" style="max-width: 720px;">

        <nav class="d-flex justify-content-between align-items-baseline mb-4 pb-2 border-bottom">
          <a href="/" class="h5 mb-0 text-decoration-none text-dark">Andy Bateman</a>
          <span>
            <a class="text-decoration-none text-dark me-3" href="/wellingtonhills">Hills</a>
            <a class="text-decoration-none text-dark" href="/posts">Stories</a>
          </span>
        </nav>

        <article>
          <h1 class="mb-1">{{ page.title }}</h1>
          <p class="text-muted mb-4">
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
            {%- if page.categories and page.categories.size > 0 %} &middot; {{ page.categories | join: ", " }}{% endif %}
          </p>

          {{ content }}
        </article>

        <p class="mt-5 mb-0"><a href="/posts">&larr; All stories</a></p>

      </div>

      <footer class="text-center text-muted small mt-4">
        <p>Built by <a href="https://builtby.ninja/" class="text-muted">Ninja</a>.</p>
      </footer>
    </main>

    {% include scripts.html %}

  </body>
</html>
